<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEGURIDAD: Content Security Policy — bloquea scripts de dominios no autorizados -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googleapis.com;
        connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com;
        img-src 'self' data:;
    ">
    <title>Gestión de Pagos y Compras</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-2: #22263a;
            --border: #2e3348;
            --accent-green: #22c55e;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --text: #e8eaf2;
            --text-muted: #6b7280;
            --danger: #ef4444;
            --radius: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ── PIN SCREEN ── */
        #pin-screen {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        #pin-screen .lock-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }

        #pin-screen h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        #pin-screen p {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 24px;
        }

        #pin-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        #pin-input:focus { border-color: var(--accent-blue); }

        #pin-error {
            color: var(--danger);
            font-size: 0.82rem;
            margin-top: 8px;
            min-height: 18px;
        }

        #pin-attempts {
            color: var(--text-muted);
            font-size: 0.78rem;
            margin-top: 4px;
        }

        /* ── MAIN APP ── */
        #app-screen {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.3s ease;
        }

        #app-screen.visible { display: block; }

        h2 {
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 28px;
        }

        .tab-btn {
            padding: 11px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab-btn.active.btn-comprar {
            background: rgba(34,197,94,0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .tab-btn.active.btn-pagar {
            background: rgba(59,130,246,0.15);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .tab-btn:not(.active):hover {
            border-color: #3e4461;
            color: var(--text);
        }

        .form-section { display: none; }
        .form-section.active { display: block; }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            appearance: none;           /* ← estándar moderno */
            -webkit-appearance: none;   /* ← compatibilidad Safari/iOS */
        }

        select:focus, input[type="number"]:focus { border-color: var(--accent-blue); }
        select option { background: var(--surface-2); }

        input[readonly] {
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .deuda-badge {
            display: none;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 0.88rem;
            margin-bottom: 16px;
            text-align: center;
        }

        .deuda-badge.visible { display: block; }
        .deuda-badge .amount { font-family: 'DM Mono', monospace; font-size: 1.1rem; font-weight: 600; }

        .notice {
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.25);
            color: #fcd34d;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 0.82rem;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--accent-green);
            color: #0a0e0a;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            margin-top: 6px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-submit:hover { opacity: 0.88; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit.pago { background: var(--accent-blue); color: white; }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── BLOQUEADO ── */
        #locked-screen {
            display: none;
            background: var(--surface);
            border: 1px solid rgba(239,68,68,0.4);
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        #locked-screen.visible { display: block; }
        #locked-screen .icon { font-size: 2.5rem; margin-bottom: 16px; }
        #locked-screen p { color: var(--text-muted); font-size: 0.88rem; margin-top: 8px; }

        /* ── LOADER ── */
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* ── SESSION INFO ── */
        .session-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .session-dot {
            width: 8px; height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        .session-label { font-size: 0.78rem; color: var(--text-muted); }
        .btn-logout {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
        }
        .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

<!-- PANTALLA: PIN de acceso -->
<div id="pin-screen">
    <div class="lock-icon">🔐</div>
    <h2>Acceso Restringido</h2>
    <p>Ingresa la contraseña para continuar</p>
    <input
        type="password"
        id="pin-input"
        placeholder="••••••••"
        maxlength="32"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
    >
    <div id="pin-error"></div>
    <div id="pin-attempts"></div>
</div>

<!-- PANTALLA: Bloqueado por intentos -->
<div id="locked-screen">
    <div class="icon">🚫</div>
    <h2 style="color: var(--danger)">Acceso Bloqueado</h2>
    <p>Demasiados intentos fallidos.<br>Espera <span id="countdown">60</span> segundos.</p>
</div>

<!-- PANTALLA: App principal -->
<div id="app-screen">
    <div class="session-bar">
        <span><span class="session-dot"></span><span class="session-label">Sesión activa</span></span>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <h2>Gestión de Pagos</h2>

    <div class="button-group">
        <button class="tab-btn btn-comprar active" onclick="mostrarSeccion('comprar', this)">Comprar</button>
        <button class="tab-btn btn-pagar" onclick="mostrarSeccion('pagar', this)">Pagar</button>
    </div>

    <!-- Formulario: Comprar -->
    <div id="seccion-comprar" class="form-section active">
        <div class="form-group">
            <label for="nombre-comprar">Persona</label>
            <select id="nombre-comprar">
                <option value="">Selecciona un nombre…</option>
            </select>
        </div>
        <div class="form-group">
            <label for="monto-gastado">Monto gastado ($)</label>
            <input type="number" id="monto-gastado" placeholder="Ej: 15000" min="1" max="9999999" step="1">
        </div>
        <button class="btn-submit" onclick="validarCompra()">Registrar Compra</button>
    </div>

    <!-- Formulario: Pagar -->
    <div id="seccion-pagar" class="form-section">
        <div class="form-group">
            <label for="nombre-pagar">Persona</label>
            <select id="nombre-pagar" onchange="consultarDeuda(this.value)">
                <option value="">Selecciona un nombre…</option>
            </select>
        </div>

        <div id="deuda-badge" class="deuda-badge">
            Deuda actual: <span class="amount" id="deuda-amount">—</span>
        </div>

        <div class="form-group">
            <label for="monto-a-pagar">Deuda registrada ($)</label>
            <input type="number" id="monto-a-pagar" readonly placeholder="Selecciona un nombre…">
        </div>
        <div class="form-group">
            <label for="monto-pagado">Monto a pagar ($)</label>
            <input type="number" id="monto-pagado" placeholder="Ej: 5000" min="1" max="9999999" step="1">
        </div>

        <div class="notice">
            <strong>Aviso:</strong> Recuerda enviar el comprobante de pago o avisar a tu miembro del área designado.
        </div>

        <button class="btn-submit pago" onclick="validarPago()">Registrar Pago</button>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<!-- SEGURIDAD: Config separada (NO subir firebase-config.js a GitHub — ver .gitignore) -->
<script src="firebase-config.js"></script>
<script src="main.js"></script>

</body>
</html>
